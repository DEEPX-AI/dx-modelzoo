name: yolo11-m_640x640_pre-optimized
display_name: Ultralytics YOLO11-m (Pre-Optimized)
task: object_detection
reference: https://github.com/ultralytics/ultralytics
license: AGPL-3.0
description: >-
  YOLO11 object detector taking a 640x640 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (yolo11_decode, nms) decodes the raw outputs into boxes
  and applies non-maximum suppression. Evaluated on the COCO detection benchmark
  reporting mean Average Precision (mAP@0.5:0.95).
macs: 36.40 GMACs
params: 20.13 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolo11_decode
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

pre_optimize_config: &pre_optimize_config
- yolo_dfl_postprocess:
    task: base
    layers:
    - bbox: /model.23/cv2.0/cv2.0.2/Conv_output_0
      cls_conf: /model.23/cv3.0/cv3.0.2/Conv_output_0
    - bbox: /model.23/cv2.1/cv2.1.2/Conv_output_0
      cls_conf: /model.23/cv3.1/cv3.1.2/Conv_output_0
    - bbox: /model.23/cv2.2/cv2.2.2/Conv_output_0
      cls_conf: /model.23/cv3.2/cv3.2.2/Conv_output_0
    num_classes: 80
    topk: 512

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
