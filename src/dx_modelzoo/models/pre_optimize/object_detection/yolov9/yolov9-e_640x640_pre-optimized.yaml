name: yolov9-e_640x640_pre-optimized
display_name: YOLOv9-e (Pre-Optimized)
task: object_detection
reference: https://github.com/WongKinYiu/yolov9
license: GPL-3.0
macs: 99.93 GMACs
params: 57.37 M
description: >-
  YOLOv9 object detector taking a 640x640 RGB image (NCHW) and producing dense
  box/class predictions. Postprocessing (yolov9_decode, nms) decodes the raw outputs into
  boxes and applies non-maximum suppression. Evaluated on the COCO detection benchmark
  reporting mean Average Precision (mAP@0.5:0.95).
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolov9_decode
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

pre_optimize_config: &pre_optimize_config
- yolo_dfl_postprocess:
    task: base
    layers:
    - bbox: conv2d_245
      cls_conf: conv2d_248
    - bbox: conv2d_251
      cls_conf: conv2d_254
    - bbox: conv2d_257
      cls_conf: conv2d_260
    num_classes: 80
    topk: 512

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
      pre_optimize_config: *pre_optimize_config
    runtime:
      device: 0
