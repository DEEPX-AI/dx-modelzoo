name: ppmatting-hrnet-w48-distinctions_512x512
display_name: ppmatting-hrnet_w48-distinctions
task: image_matting
reference: https://github.com/PaddlePaddle/PaddleSeg/blob/release/2.8/Matting/configs/ppmatting/ppmatting-hrnet_w48-distinctions.yml
license: Apache-2.0
description: PaddleSeg PP-Matting HRNet-W48 trimap-free image matting model evaluated on the official Distinctions-646 test
  split (50 foregrounds x 20 PASCAL VOC 2012 backgrounds).
macs: 173.81 GMACs
params: 85.85 M
evaluator:
  type: image_matting
inputs:
- name: img
  shape:
  - 1
  - 3
  - 512
  - 512
  dtype: float32
  layout: NCHW
preprocessing:
- type: convertcolor
  form: BGR2RGB
- type: resize
  width: 512
  height: 512
  interpolation: LINEAR
- type: div
  x: 255
- type: normalize
  mean:
  - 0.5
  - 0.5
  - 0.5
  std:
  - 0.5
  - 0.5
  - 0.5
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: identity
dataset:
  type: Distinctions646
  eval_path: ${DATA_ROOT}/Distinctions-646
  background_dir: ${DATA_ROOT}/PascalVOC/VOCdevkit/VOC2012/JPEGImages
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
