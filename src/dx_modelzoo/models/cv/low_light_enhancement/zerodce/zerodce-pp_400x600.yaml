name: zerodce-pp_400x600
display_name: Zero-DCE++
task: low_light_enhancement
reference: https://github.com/Li-Chongyi/Zero-DCE_extension
description: >-
  Zero-DCE++ low-light image enhancement model on a 400x600 RGB input that estimates
  pixel-wise light-enhancement curves and applies them iteratively to brighten the
  image; it is a lighter, accelerated variant of Zero-DCE with depthwise-separable
  convolutions (postprocessing is identity). Evaluated on the LOL benchmark reporting
  PSNR and SSIM.
macs: 2.84 GMACs
params: 10.56 K
inputs:
- name: input
  shape:
  - 1
  - 3
  - 400
  - 600
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: default
  size:
  - 400
  - 600
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: identity
dataset:
  type: LOL
  eval_path: ${DATA_ROOT}/LOL
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
