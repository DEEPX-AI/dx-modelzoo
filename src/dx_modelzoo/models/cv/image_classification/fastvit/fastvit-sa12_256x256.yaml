name: fastvit-sa12_256x256
display_name: FastViT-SA12
task: image_classification
reference: https://github.com/apple/ml-fastvit
license: Apache-2.0
description: >-
  FastViT-SA12 hybrid Vision Transformer image classification model evaluated
  on the ImageNet ILSVRC2012 validation set.
macs: 2.01 GMACs
params: 11.54 M

evaluator:
  type: image_classification
inputs:
- name: input
  shape: [1, 3, 256, 256]
  dtype: float32
  layout: NCHW

preprocessing:
- type: resize
  mode: torchvision
  size: 256
  interpolation: BICUBIC
- type: centercrop
  height: 256
  width: 256
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean: [0.5, 0.5, 0.5]
  std: [0.5, 0.5, 0.5]
- type: transpose
  axis: [2, 0, 1]
- type: expanddim
  axis: 0

postprocessing:
- type: topk
  k: [1, 5]

dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
      async: true
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
      async: true
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
      async: true
