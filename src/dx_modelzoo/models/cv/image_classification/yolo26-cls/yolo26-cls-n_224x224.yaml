name: yolo26-cls-n_224x224
display_name: Ultralytics YOLO26-n-cls
task: image_classification
reference: https://github.com/ultralytics/ultralytics
license: AGPL-3.0
description: >-
  YOLO26 classification CNN image classification model that ingests a 224x224 RGB image
  (NCHW, ImageNet mean/std normalization) and outputs a 1000-way logit vector over the
  ImageNet-1k categories. Postprocessing applies top-k selection on the class logits.
  Evaluated on the ImageNet (ILSVRC2012) validation set reporting Top-1 and Top-5
  classification accuracy.
macs: 0.24 GMACs
params: 2.81 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 224
  - 224
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: torchvision
  size: 224
  interpolation: BILINEAR
- type: centercrop
  height: 224
  width: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: topk
  k:
  - 1
  - 5
dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: []
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
