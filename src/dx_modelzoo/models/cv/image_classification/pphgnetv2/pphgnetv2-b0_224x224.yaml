name: pphgnetv2-b0_224x224
display_name: PPHGNetV2_B0
task: image_classification
reference: https://github.com/PaddlePaddle/PaddleClas/blob/develop/ppcls/arch/backbone/legendary_models/pp_hgnet_v2.py
license: Apache-2.0
description: PaddleClas PP-HGNetV2 B0 ImageNet classifier.
macs: 0.39 GMACs
params: 6.01 M
evaluator:
  type: image_classification
inputs:
- name: x
  shape:
  - 1
  - 3
  - 224
  - 224
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: torchvision
  size: 256
  interpolation: BILINEAR
- type: centercrop
  height: 224
  width: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: topk
  k:
  - 1
  - 5
dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
