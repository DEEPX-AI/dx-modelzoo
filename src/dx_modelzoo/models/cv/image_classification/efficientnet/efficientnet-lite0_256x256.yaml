name: efficientnet-lite0_256x256
display_name: EfficientNet-Lite0
task: image_classification
reference: https://github.com/huggingface/pytorch-image-models
description: >-
  EfficientNet compound-scaled CNN image classification model that ingests a 256x256 RGB
  image (NHWC, ImageNet mean/std normalization) and outputs a 1000-way logit vector over
  the ImageNet-1k categories. Postprocessing applies top-k selection on the class
  logits. Evaluated on the ImageNet (ILSVRC2012) validation set reporting Top-1 and
  Top-5 classification accuracy.
macs: 404.52 MMACs
params: 4.63 M
inputs:
- name: input
  shape:
  - 1
  - 256
  - 256
  - 3
  dtype: float32
  layout: NHWC
preprocessing:
- type: resize
  mode: torchvision
  size: 256
  interpolation: BILINEAR
- type: centercrop
  height: 224
  width: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean:
  - 0.5
  - 0.5
  - 0.5
  std:
  - 0.5
  - 0.5
  - 0.5
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: topk
  k:
  - 1
  - 5
dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
