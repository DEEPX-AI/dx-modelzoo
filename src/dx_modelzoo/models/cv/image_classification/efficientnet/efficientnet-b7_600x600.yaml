name: efficientnet-b7_600x600
display_name: EfficientNet-B7
task: image_classification
reference: https://github.com/pytorch/vision
description: >-
  EfficientNet compound-scaled CNN image classification model that ingests a 600x600 RGB
  image (NCHW, ImageNet mean/std normalization) and outputs a 1000-way logit vector over
  the ImageNet-1k categories. Postprocessing applies top-k selection on the class
  logits. Evaluated on the ImageNet (ILSVRC2012) validation set reporting Top-1 and
  Top-5 classification accuracy.
macs: 46.87 GMACs
params: 66.19 M

evaluator:
  type: image_classification

inputs:
  - name: input
    shape: [1, 3, 600, 600]
    dtype: float32
    layout: NCHW

preprocessing:
  - type: resize
    mode: torchvision
    size: 600
    interpolation: BICUBIC
  - type: centercrop
    height: 600
    width: 600
  - type: convertcolor
    form: BGR2RGB
  - type: div
    x: 255
  - type: normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: transpose
    axis: [2, 0, 1]
  - type: expanddim
    axis: 0

postprocessing:
  - type: topk
    k: [1, 5]

dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
