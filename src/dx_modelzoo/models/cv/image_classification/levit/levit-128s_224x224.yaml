name: levit-128s_224x224
task: image_classification
reference: https://github.com/facebookresearch/LeViT
license: Apache-2.0
macs: N/A
params: N/A
description: levit-128s_224x224 image_classification model with 224x224 input.
evaluator:
  type: image_classification
inputs:
- name: input
  shape: [1, 3, 224, 224]
  dtype: float32
  layout: NCHW

preprocessing:
- type: resize
  mode: torchvision
  size: 256
  interpolation: BICUBIC
- type: centercrop
  height: 224
  width: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
- type: transpose
  axis: [2, 0, 1]
- type: expanddim
  axis: 0

postprocessing:
- type: topk
  k: [1, 5]

dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
      async: true
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
      async: true
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
      async: true
  q-master:
    target: dxnn
    compile:
      calibration: *calibration
      qmaster:
        config:
          batch_size: 16
          train_limit: 50000
          val_limit: 5000
          max_grad_norm: 0.5
          use_amp: false
          criterion: mse
          use_kd: true
          kd_loss: mse
          kd_alpha: 1.0
          scheduler: cosine
          save_best_model: false
          early_stopping_delta: 0.0
          freeze_bn_after: 0
    runtime:
      device: 0
      async: true
