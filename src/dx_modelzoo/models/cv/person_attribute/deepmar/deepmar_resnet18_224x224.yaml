name: deepmar_resnet18_224x224
display_name: DeepMAR ResNet-18
task: person_attribute
reference: https://github.com/dangweili/pedestrian-attribute-recognition-pytorch
description: >-
  DeepMAR pedestrian (person) attribute recognition with a ResNet-18 backbone on
  a 224x224 RGB crop (NCHW, ImageNet mean/std normalization). The network is a
  multi-label classifier emitting one logit per pedestrian attribute (sigmoid
  per attribute, no mutual exclusivity); postprocessing is identity. Evaluated
  on the PETA dataset with the person_attribute evaluator (label-based mean
  accuracy, mA).
macs: 1.82 GMACs
params: 11.19 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 224
  - 224
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  width: 224
  height: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: identity
dataset:
  type: PETA
  eval_path: ${DATA_ROOT}/PETA
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
