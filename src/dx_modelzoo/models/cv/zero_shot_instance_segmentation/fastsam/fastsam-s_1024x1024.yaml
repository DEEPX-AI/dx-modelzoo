name: fastsam-s_1024x1024
display_name: FastSAM-s
task: zero_shot_instance_segmentation
reference: https://github.com/CASIA-IVA-Lab/FastSAM
description: >-
  FastSAM-s (Fast Segment Anything Model) — a YOLOv8-seg based CNN that performs
  class-agnostic "segment everything" instance segmentation, trained on 2% of
  the SA-1B data yet approaching SAM quality at ~50x the speed. Input is a
  1024x1024 edge-padded (letterbox, pad=114) RGB tensor scaled by 1/255. The
  network emits YOLOv8-seg style outputs (detection boxes + objectness, 32 mask
  coefficients, and a prototype-mask branch); the fastsam_decode op assembles
  per-instance masks (proto x coeff, sigmoid, crop to box) and applies NMS to
  produce class-agnostic instance masks. Evaluated zero-shot on COCO with the
  zero_shot_instance_segmentation evaluator (AR@10 / AR@100 / AR@1000).
macs: 57.15 GMACs
params: 11.84 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1024
  - 1024
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 1024
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: fastsam_decode
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
