name: clip-img_vit-b16-quickgelu_224x224_metaclip-fullcc
display_name: CLIP ViT-B/16 QuickGELU (MetaCLIP FullCC)
task: zero_shot_image_classification
reference: https://github.com/mlfoundations/open_clip
license: MIT
description: >-
  CLIP image-encoder branch with a ViT-B/16 QuickGELU image encoder (MetaCLIP FullCC
  weights) on a 224x224 RGB input, producing an image embedding aligned to CLIP text
  embeddings. Zero-shot classification is evaluated on the ImageNet ILSVRC2012
  validation set. The ticket calls this artifact ViT-B/32, but the supplied ONNX graph
  and OpenCLIP model identity are ViT-B/16.
macs: 18.06 GMACs
params: 86.19 M
inputs:
- name: image
  shape:
  - 1
  - 3
  - 224
  - 224
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  width: 224
  height: 224
- type: centercrop
  height: 224
  width: 224
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean:
  - 0.48145466
  - 0.4578275
  - 0.40821073
  std:
  - 0.26862954
  - 0.26130258
  - 0.27577711
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: clip_zero_shot
appendix:
  clip_model_name: ViT-B-16-quickgelu
  clip_pretrained: metaclip_fullcc
  npu_skip_arithmetic: false
dataset:
  type: ILSVRC2012
  eval_path: ${DATA_ROOT}/ILSVRC2012/val
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
