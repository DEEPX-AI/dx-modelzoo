name: eigenplaces-resnet18_512x512
display_name: EigenPlaces ResNet-18
task: visual_place_recognition
reference: https://github.com/gmberton/EigenPlaces
description: |
  EigenPlaces Visual Place Recognition (ResNet18 + GeM), 512-dim global descriptor.
  Static input [1,3,512,512]. cuVSLAM loop-closure / re-localization replacement.
  Metric: Recall@1 (HPatches surrogate — each sequence ref vs gallery).
macs: 9.52 GMACs
params: 11.43 M
inputs:
- name: image
  shape: [1, 3, 512, 512]
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  width: 512
  height: 512
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
- type: transpose
  axis: [2, 0, 1]
- type: expanddim
  axis: 0
postprocessing:
- type: l2_normalize   # custom_ops.py: L2-normalize descriptor (visual_place_recognition evaluator also re-normalizes)
dataset:
  type: HPatches
  eval_path: ${DATA_ROOT}/hpatches/hpatches-sequences-release
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0

  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
