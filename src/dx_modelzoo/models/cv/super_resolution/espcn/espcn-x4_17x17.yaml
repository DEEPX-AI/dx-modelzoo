name: espcn-x4_17x17
display_name: ESPCN-x4
task: super_resolution
reference: https://github.com/Lornatang/ESPCN-PyTorch
license: MIT
description: >-
  ESPCN efficient sub-pixel CNN for x4 single-image super-resolution, taking a 17x17
  low-resolution luminance (Y) patch and reconstructing the high-resolution output via a
  sub-pixel (pixel-shuffle) layer. Evaluated on the BSD100 benchmark reporting PSNR and
  SSIM.
macs: 0.01 GMACs
params: 0.02 M
inputs:
- name: input
  shape:
  - 1
  - 1
  - 17
  - 17
  dtype: float32
  layout: NCHW
preprocessing:
- type: centercrop
  height: 17
  width: 17
- type: bgr_to_y_channel_uint8
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: sr_postprocessing
  upscale_factor: 4
dataset:
  type: BSD100
  eval_path: ${DATA_ROOT}/BSD100/bicubic_4x
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
appendix:
  upscale_factor: 4
  hr_preprocessing:
  - type: centercrop
    height: 68
    width: 68
  - type: bgr_to_y_channel
  - type: transpose
    axis:
    - 2
    - 0
    - 1
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
