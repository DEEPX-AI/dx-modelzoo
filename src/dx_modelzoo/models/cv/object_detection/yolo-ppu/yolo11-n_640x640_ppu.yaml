name: yolo11-n_640x640_ppu
display_name: Ultralytics YOLO11-n (PPU)
task: object_detection
reference: https://github.com/ultralytics/ultralytics
description: >-
  YOLO11 object detector taking a 640x640 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (ppu_nms) decodes the raw outputs into boxes and applies
  non-maximum suppression. Evaluated on the COCO detection benchmark reporting mean
  Average Precision (mAP@0.5:0.95).
macs: 3.88 GMACs
params: 2.66 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: ppu_nms
  variant: yolo11
  box_format: cxcywh
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: &ppu_config
        type: 1
        conf_thres: 0.001
        num_classes: 80
        layer:
          - bbox: /model.23/Mul_2
            cls_conf: /model.23/Sigmoid
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
      ppu_config: *ppu_config
    runtime:
      device: 0
