name: yolox-s_640x640_ppu
display_name: YOLOX-s (PPU)
task: object_detection
reference: https://github.com/Megvii-BaseDetection/YOLOX
description: >-
  YOLOX anchor-free object detector taking a 640x640 RGB image (NCHW) and producing
  dense box/class predictions. Postprocessing (ppu_nms) decodes the raw outputs into
  boxes and applies non-maximum suppression. Evaluated on the COCO detection benchmark
  reporting mean Average Precision (mAP@0.5:0.95).
macs: 14.41 GMACs
params: 8.96 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NHWC
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: ppu_nms
  variant: yolox
  yolo_version: x
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: &ppu_config
        type: 1
        conf_thres: 0.001
        num_classes: 80
        layer:
          - bbox: Conv_261
            obj_conf: Conv_262
            cls_conf: Conv_254
          - bbox: Conv_282
            obj_conf: Conv_283
            cls_conf: Conv_275
          - bbox: Conv_303
            obj_conf: Conv_304
            cls_conf: Conv_296
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
      ppu_config: *ppu_config
    runtime:
      device: 0
