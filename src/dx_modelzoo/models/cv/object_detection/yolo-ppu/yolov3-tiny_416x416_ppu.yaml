name: yolov3-tiny_416x416_ppu
display_name: YOLOv3-tiny (PPU)
task: object_detection
reference: https://github.com/AlexeyAB/darknet
description: >-
  YOLOv3 object detector taking a 416x416 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (ppu_nms) decodes the raw outputs into boxes and applies
  non-maximum suppression. Evaluated on the COCO detection benchmark reporting mean
  Average Precision (mAP@0.5:0.95).
macs: null
params: null
inputs:
- name: input
  shape:
  - 1
  - 3
  - 416
  - 416
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 416
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: ppu_nms
  variant: yolo
  yolo_version: v3
  anchors:
  - - - 10
      - 14
    - - 23
      - 27
    - - 37
      - 58
  - - - 81
      - 82
    - - 135
      - 169
    - - 344
      - 319
  strides:
  - 16
  - 32
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: &ppu_config
        type: 0
        conf_thres: 0.001
        activation: Sigmoid
        num_classes: 80
        layer:
          Conv_46:
            num_anchors: 3
          Conv_95:
            num_anchors: 3
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
      ppu_config: *ppu_config
    runtime:
      device: 0
