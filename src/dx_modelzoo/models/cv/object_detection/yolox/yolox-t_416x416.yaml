name: yolox-t_416x416
display_name: YOLOX-t
task: object_detection
reference: https://github.com/Megvii-BaseDetection/YOLOX
description: >-
  YOLOX anchor-free object detector taking a 416x416 RGB image (NCHW) and producing
  dense box/class predictions. Postprocessing (yolox_decode, nms) decodes the raw
  outputs into boxes and applies non-maximum suppression. Evaluated on the COCO
  detection benchmark reporting mean Average Precision (mAP@0.5:0.95).
macs: 3.55 GMACs
params: 5.05 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 416
  - 416
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 416
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolox_decode
  input_size: 416
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
