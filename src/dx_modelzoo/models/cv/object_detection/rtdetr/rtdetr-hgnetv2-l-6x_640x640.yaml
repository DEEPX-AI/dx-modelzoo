name: rtdetr-hgnetv2-l-6x_640x640
display_name: rtdetr_hgnetv2_l_6x_coco
task: object_detection
reference: https://github.com/PaddlePaddle/PaddleDetection/blob/release/2.9/configs/rtdetr/rtdetr_hgnetv2_l_6x_coco.yml
license: Apache-2.0
description: PaddleDetection rtdetr_hgnetv2_l_6x_coco object detection model evaluated with the COCO dataset and 640x640 input.
macs: 56.85 GMACs
params: 32.26 M
evaluator:
  type: object_detection
inputs:
- name: image
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  width: 640
  height: 640
  interpolation: BICUBIC
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: rtdetr_decode
  pad_location: direct
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
