name: yolov5-m6_1280x1280
display_name: Ultralytics YOLOv5-m6 (1280x1280)
task: object_detection
reference: https://github.com/ultralytics/yolov5
description: >-
  YOLOv5 object detector taking a 1280x1280 RGB image (NCHW) and producing dense
  box/class predictions. Postprocessing (yolov5_decode, nms) decodes the raw outputs
  into boxes and applies non-maximum suppression. Evaluated on the COCO detection
  benchmark reporting mean Average Precision (mAP@0.5:0.95).
macs: 106.41 GMACs
params: 35.70 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1280
  - 1280
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 1280
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolov5_decode
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
