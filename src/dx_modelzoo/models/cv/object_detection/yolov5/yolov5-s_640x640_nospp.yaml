name: yolov5-s_640x640_nospp
display_name: Ultralytics YOLOv5-s (no-SPP)
task: object_detection
reference: https://github.com/ultralytics/yolov5
description: >-
  YOLOv5 object detector taking a 640x640 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (yolov5_multiscale_decode, nms) decodes the raw outputs
  into boxes and applies non-maximum suppression. Evaluated on the COCO detection
  benchmark reporting mean Average Precision (mAP@0.5:0.95).
macs: 9.08 GMACs
params: 7.86 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolov5_multiscale_decode
  anchors:
  - - - 116
      - 90
    - - 156
      - 198
    - - 373
      - 326
  - - - 30
      - 61
    - - 62
      - 45
    - - 59
      - 119
  - - - 10
      - 13
    - - 16
      - 30
    - - 33
      - 23
  strides:
  - 32
  - 16
  - 8
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
