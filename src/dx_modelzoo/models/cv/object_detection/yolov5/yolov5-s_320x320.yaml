name: yolov5-s_320x320
display_name: Ultralytics YOLOv5-s (320x320)
task: object_detection
reference: https://github.com/ultralytics/yolov5
description: >-
  YOLOv5 object detector taking a 320x320 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (yolov5_decode, nms) decodes the raw outputs into boxes
  and applies non-maximum suppression. Evaluated on the COCO detection benchmark
  reporting mean Average Precision (mAP@0.5:0.95).
macs: 2.35 GMACs
params: 7.27 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 320
  - 320
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 320
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolov5_decode
- type: nms
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
