name: yolov6-m6_1280x1280
task: object_detection
reference: https://github.com/meituan/YOLOv6
license: GPL-3.0
description: Meituan YOLOv6 object detection model with a 1280x1280 input.
macs: 190.96 GMACs
params: 79.64 M

inputs:
- name: images
  shape: [1, 3, 1280, 1280]
  dtype: float32
  layout: NCHW

preprocessing:
- type: resize
  mode: pad
  size: 1280
  pad_location: edge
  pad_value: [114, 114, 114]
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis: [2, 0, 1]
- type: expanddim
  axis: 0

postprocessing:
- type: yolov6_decode
- type: nms

dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
