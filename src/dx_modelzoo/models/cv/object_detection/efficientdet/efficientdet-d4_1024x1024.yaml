name: efficientdet-d4_1024x1024
display_name: EfficientDet-D4
task: object_detection
reference: https://github.com/zylo117/Yet-Another-EfficientDet-Pytorch
description: >-
  EfficientDet object detector taking a 1024x1024 RGB image (NCHW) and producing dense
  box/class predictions. Postprocessing (efficientdet_decode) decodes the raw outputs
  into boxes and applies non-maximum suppression. Evaluated on the COCO detection
  benchmark reporting mean Average Precision (mAP@0.5:0.95).
macs: 69.37 GMACs
params: 22.23 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1024
  - 1024
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 1024
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: efficientdet_decode
  input_size: 1024
evaluator:
  options:
    use_class_90: true
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
