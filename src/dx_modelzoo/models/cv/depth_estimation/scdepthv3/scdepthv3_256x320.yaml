name: scdepthv3_256x320
display_name: SC-DepthV3
task: depth_estimation
reference: https://github.com/JiawangBian/sc_depth_pl
license: MIT
description: >-
  SC-DepthV3 self-supervised monocular depth estimation model on a 256x320 RGB input,
  regressing a dense per-pixel depth map (postprocessing is identity). Evaluated on the
  NYU Depth v2 benchmark reporting Root-Mean-Square Error (RMSE).
macs: 5.36 GMACs
params: 14.32 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 256
  - 320
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: default
  size:
  - 256
  - 320
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: identity
appendix:
  use_scale_shift: true
  max_depth: 10
  eigen_crop: true
  label_preprocessing:
  - type: resize
    mode: default
    size:
    - 256
    - 320
  - type: expanddim
    axis: 0
dataset:
  type: NYUDepthv2
  eval_path: ${DATA_ROOT}/nyudepthv2
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
