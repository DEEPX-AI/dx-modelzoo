name: yolo26-depth-x_768x768
display_name: Ultralytics YOLO26-x-depth
task: depth_estimation
reference: https://github.com/ultralytics/ultralytics
description: >-
  Ultralytics YOLO26-x monocular depth estimation model taking a 768x768 RGB image
  and producing a dense per-pixel depth map. Evaluated on the NYU Depth v2 benchmark
  reporting Root-Mean-Square Error (RMSE).
macs: 158.86 GMACs
params: 55.80 M
inputs:
- name: images
  shape:
  - 1
  - 3
  - 768
  - 768
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: default
  size:
  - 768
  - 768
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: identity
appendix:
  use_scale_shift: true
  max_depth: 10
  eigen_crop: true
  label_preprocessing:
  - type: resize
    mode: default
    size:
    - 768
    - 768
dataset:
  type: NYUDepthv2
  eval_path: ${DATA_ROOT}/nyudepthv2
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
