name: yolo26-x-obb_1024x1024
display_name: Ultralytics YOLO26-x-obb
task: oriented_object_detection
reference: https://github.com/ultralytics/ultralytics
description: >-
  YOLO26-OBB oriented object detector on a 1024x1024 RGB input that predicts rotated
  bounding boxes (center, size and angle) with class scores. Postprocessing
  (yolo26_obb_decode) decodes oriented boxes and applies rotated NMS. Evaluated on the
  DOTA-v1 aerial benchmark reporting mean Average Precision (mAP) for oriented boxes.
macs: 272.11 GMACs
params: 57.62 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1024
  - 1024
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 1024
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolo26_obb_decode
dataset:
  type: DOTAv1
  eval_path: ${DATA_ROOT}/DOTAv1
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
