name: yolo26-n-obb_1024x1024
display_name: Ultralytics YOLO26-n-obb
task: oriented_object_detection
reference: https://github.com/ultralytics/ultralytics
license: AGPL-3.0
description: >-
  YOLO26-OBB oriented object detector on a 1024x1024 RGB input that predicts rotated
  bounding boxes (center, size and angle) with class scores. Postprocessing
  (yolo26_obb_decode) decodes oriented boxes and applies rotated NMS. Evaluated on the
  DOTA-v1 aerial benchmark reporting mean Average Precision (mAP) for oriented boxes.
macs: 8.96 GMACs
params: 2.51 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1024
  - 1024
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 1024
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolo26_obb_decode
dataset:
  type: DOTAv1
  eval_path: ${DATA_ROOT}/DOTAv1
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
  q-master:
    target: dxnn
    compile:
      calibration: *calibration
      qmaster:
        config:
          batch_size: 16
          train_limit: 50000
          val_limit: 5000
          max_grad_norm: 0.5
          use_amp: false
          criterion: mse
          use_kd: true
          kd_loss: mse
          kd_alpha: 1.0
          scheduler: cosine
          save_best_model: false
          early_stopping_delta: 0.0
          freeze_bn_after: 0
    runtime:
      device: 0
