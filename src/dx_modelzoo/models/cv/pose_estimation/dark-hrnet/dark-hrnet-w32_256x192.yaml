name: dark-hrnet-w32_256x192
display_name: dark_hrnet_w32_256x192
task: pose_estimation
reference: https://github.com/PaddlePaddle/PaddleDetection/blob/release/2.6/configs/pphuman/dark_hrnet_w32_256x192.yml
license: Apache-2.0
description: PaddleDetection dark_hrnet_w32_256x192 pose estimation model evaluated with the COCOPoseTopDown dataset and 256x192
  input.
macs: 8.27 GMACs
params: 28.59 M
evaluator:
  type: pose_estimation_topdown
  options:
    model_input_w: 256
    model_input_h: 192
inputs:
- name: image
  shape:
  - 1
  - 3
  - 192
  - 256
  dtype: float32
  layout: NCHW
preprocessing:
- type: convertcolor
  form: BGR2RGB
- type: resize
  width: 256
  height: 192
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: dark_hrnet_heatmap_decode
  model_w: 256
  model_h: 192
dataset:
  type: COCOPoseTopDown
  eval_path: ${DATA_ROOT}/COCO
  model_input_w: 256
  model_input_h: 192
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
