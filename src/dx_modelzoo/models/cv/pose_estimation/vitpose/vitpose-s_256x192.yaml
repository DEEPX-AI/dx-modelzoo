name: vitpose-s_256x192
display_name: ViTPose-S
task: pose_estimation
reference: https://github.com/ViTAE-Transformer/ViTPose
description: |
  ViTPose-Small top-down pose estimation.
  Input is a person-cropped patch [1,3,256,192]; output is 17 keypoint
  Gaussian heatmaps [1,17,64,48] decoded via argmax.
macs: 8.94 GMACs
params: 24.38 M
inputs:
  - name: pixel_values
    shape: [1, 3, 256, 192]
    dtype: float32
    layout: NCHW
preprocessing:
  - type: resize
    width: 192
    height: 256
  - type: convertcolor
    form: BGR2RGB
  - type: div
    x: 255
  - type: normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: transpose
    axis: [2, 0, 1]
  - type: expanddim
    axis: 0
postprocessing:
  - type: vitpose_heatmap_decode
    model_w: 192
    model_h: 256
dataset:
  type: COCOPoseTopDown
  eval_path: ${DATA_ROOT}/COCO
evaluator:
  type: pose_estimation_topdown
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
