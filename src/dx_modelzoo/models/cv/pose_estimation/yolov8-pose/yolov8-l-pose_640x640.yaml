name: yolov8-l-pose_640x640
display_name: Ultralytics YOLOv8-l-pose
task: pose_estimation
reference: https://github.com/ultralytics/ultralytics
description: >-
  YOLOv8-Pose human pose estimation model on a 640x640 RGB input that jointly detects
  people and regresses 17 COCO body keypoints with confidences. Postprocessing
  (yolov8_pose_decode) decodes keypoints and applies NMS. Evaluated on the COCO keypoint
  benchmark reporting keypoint Average Precision (OKS-based AP).
macs: 86.85 GMACs
params: 44.53 M
inputs:
  - name: input
    shape: [1, 3, 640, 640]
    dtype: float32
    layout: NCHW

preprocessing:
  - type: resize
    mode: pad
    size: 640
    pad_location: edge
    pad_value: [114, 114, 114]
  - type: div
    x: 255
  - type: convertcolor
    form: BGR2RGB
  - type: transpose
    axis: [2, 0, 1]
  - type: expanddim
    axis: 0

postprocessing:
  - type: yolov8_pose_decode

dataset:
  type: COCOPose
  eval_path: ${DATA_ROOT}/COCO

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
