name: yolov5-s6-pose_640x640
display_name: Ultralytics YOLOv5-s6-pose
task: pose_estimation
reference: https://github.com/ultralytics/yolov5
description: >-
  YOLOv5-Pose human pose estimation model on a 640x640 RGB input that jointly detects
  people and regresses 17 COCO body keypoints with confidences. Postprocessing
  (yolov5_pose_decode) decodes keypoints and applies NMS. Evaluated on the COCO keypoint
  benchmark reporting keypoint Average Precision (OKS-based AP).
macs: 8.53 GMACs
params: 7.06 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: div
  x: 255
- type: expanddim
  axis: 0
postprocessing:
- type: yolov5_pose_decode
  iou_thres: 0.5
dataset:
  type: COCOPose
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
