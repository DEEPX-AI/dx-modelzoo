name: centerpose-fpn_regnet-x1.6gf_512x512
display_name: CenterPose-FPN (RegNetX-1.6GF)
task: pose_estimation
reference: https://github.com/NVlabs/CenterPose
description: >-
  CenterPose center-based human pose estimation model on a 512x512 RGB input that
  jointly detects people and regresses 17 COCO body keypoints with confidences.
  Postprocessing (centerpose_decode) decodes keypoints and applies NMS. Evaluated on the
  COCO keypoint benchmark reporting keypoint Average Precision (OKS-based AP).
macs: 42.33 GMACs
params: 12.37 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 512
  - 512
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 512
  pad_location: edge
  pad_value:
  - 0
  - 0
  - 0
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: centerpose_decode
  input_size: 512
  conf_thres: 0.1
dataset:
  type: COCOPose
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
