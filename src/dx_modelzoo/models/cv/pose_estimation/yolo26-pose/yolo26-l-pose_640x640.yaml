name: yolo26-l-pose_640x640
display_name: Ultralytics YOLO26-l-pose
task: pose_estimation
reference: https://github.com/ultralytics/ultralytics
license: AGPL-3.0
description: >-
  YOLO26-Pose human pose estimation model on a 640x640 RGB input that jointly detects
  people and regresses 17 COCO body keypoints with confidences. Postprocessing
  (yolo26_pose_decode) decodes keypoints and applies NMS. Evaluated on the COCO keypoint
  benchmark reporting keypoint Average Precision (OKS-based AP).
macs: 48.89 GMACs
params: 26.00 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: div
  x: 255
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolo26_pose_decode
dataset:
  type: COCOPose
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: iqr
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
