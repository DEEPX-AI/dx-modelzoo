name: yolov12-seg-n_640x640
display_name: YOLOv12-n-seg
task: instance_segmentation
reference: https://github.com/sunsmarterjie/yolov12
license: AGPL-3.0
description: >-
  YOLOv12 instance segmentation model on a 640x640 RGB input that predicts object
  boxes, classes and per-instance mask coefficients/prototypes. Postprocessing
  (yolov12_seg_decode) assembles per-instance masks and applies NMS. Evaluated on the COCO
  instance segmentation benchmark reporting mask mean Average Precision (mAP).
macs: 6.47 GMACs
params: 2.82 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: yolov12_seg_decode
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
