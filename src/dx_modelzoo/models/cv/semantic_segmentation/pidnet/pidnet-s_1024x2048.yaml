name: pidnet-s_1024x2048
display_name: PIDNet-S
task: semantic_segmentation
reference: https://github.com/XuJiacong/PIDNet
description: 'PIDNet-S: real-time semantic segmentation model evaluated at full 1024x2048
macs: 47.86 GMACs
params: 7.62 M
  resolution on Cityscapes. Output logits (1/8 scale) are upsampled to the label
  resolution for evaluation.'
inputs:
- name: input
  shape:
  - 1
  - 3
  - 1024
  - 2048
  dtype: float32
  layout: NCHW
preprocessing:
- type: convertcolor
  form: BGR2RGB
- type: resize
  width: 2048
  height: 1024
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: segmentation_argmax
  target_size:
  - 1024
  - 2048
dataset:
  type: Cityscapes
  eval_path: ${DATA_ROOT}/cityscapes
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
