name: deeplabv3_mobilenetv2_513x513_nodilation
display_name: DeepLabV3 (MobileNetV2, no-dilation)
task: semantic_segmentation
reference: https://github.com/pytorch/vision
description: >-
  DeepLabV3 atrous segmentation network for semantic segmentation on a 513x513 RGB
  input, producing per-pixel class logits. Postprocessing applies a per-pixel argmax to
  yield the segmentation map. Evaluated on the PascalVOC2012 segmentation benchmark
  reporting mean Intersection-over-Union (mIoU).
macs: 1.73 GMACs
params: 2.10 M

evaluator:
  type: semantic_segmentation

inputs:
  - name: input
    shape: [1, 513, 513, 3]
    dtype: float32
    layout: NHWC

preprocessing:
  - type: convertcolor
    form: BGR2RGB
  - type: resize
    mode: torchvision
    size: 513
    interpolation: NEAREST
  - type: centercrop
    height: 513
    width: 513
  - type: div
    x: 255
  - type: normalize
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  - type: expanddim
    axis: 0

postprocessing:
  - type: segmentation_argmax

dataset:
  type: PascalVOC2012
  eval_path: ${DATA_ROOT}/PascalVOC/VOCdevkit/VOC2012

appendix:
  label_preprocessing:
    - type: resize
      mode: torchvision
      size: 513
      interpolation: NEAREST
    - type: centercrop
      height: 513
      width: 513

artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          num_samples: 100
          method: ema
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
