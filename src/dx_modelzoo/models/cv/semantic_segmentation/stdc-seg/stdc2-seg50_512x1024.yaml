name: stdc2-seg50_512x1024
display_name: STDC2-Seg50
task: semantic_segmentation
reference: https://github.com/MichaelFan01/STDC-Seg
description: 'STDC2-Seg50: STDC2 backbone semantic segmentation model evaluated at 0.5
macs: 24.44 GMACs
params: 12.45 M
  scale (seg50) on Cityscapes. Input resized to 512x1024.'
inputs:
- name: x
  shape:
  - 1
  - 3
  - 512
  - 1024
  dtype: float32
  layout: NCHW
preprocessing:
- type: convertcolor
  form: BGR2RGB
- type: resize
  width: 1024
  height: 512
- type: div
  x: 255
- type: normalize
  mean:
  - 0.485
  - 0.456
  - 0.406
  std:
  - 0.229
  - 0.224
  - 0.225
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: segmentation_argmax
  target_size:
  - 1024
  - 2048
dataset:
  type: Cityscapes
  eval_path: ${DATA_ROOT}/cityscapes
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
