name: ddrnet23_1024x2048
display_name: DDRNet23
task: semantic_segmentation
reference: https://github.com/ydhongHIT/DDRNet
license: MIT
description: >-
  DDRNet-23 semantic segmentation model for Cityscapes at 1024x2048
  resolution. The reference reports approximately 77% mIoU on Cityscapes
  validation.
macs: 143.90 GMACs
params: 20.15 M
inputs:
- name: input.1
  shape: [1, 3, 1024, 2048]
  dtype: float32
  layout: NCHW
preprocessing:
- type: convertcolor
  form: BGR2RGB
- type: resize
  width: 2048
  height: 1024
- type: div
  x: 255
- type: normalize
  mean: [0.485, 0.456, 0.406]
  std: [0.229, 0.224, 0.225]
- type: transpose
  axis: [2, 0, 1]
- type: expanddim
  axis: 0
postprocessing:
- type: segmentation_argmax
  target_size: [1024, 2048]
dataset:
  type: Cityscapes
  eval_path: ${DATA_ROOT}/cityscapes
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      buffer_count: 1
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      buffer_count: 1
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      buffer_count: 1
      device: 0
