name: retinaface_mobilenet-0.25_640x640
display_name: RetinaFace (MobileNet-0.25)
task: face_detection
reference: https://github.com/deepinsight/insightface
description: >-
  RetinaFace single-stage face detector on a 640x640 RGB input that predicts face
  bounding boxes (with landmarks) and confidences. Postprocessing (retinaface_decode)
  decodes anchors/priors and applies NMS. Evaluated on the WiderFace benchmark reporting
  Average Precision (AP).
macs: 1.02 GMACs
params: 423.26 K
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 0
  - 0
  - 0
- type: normalize
  mean:
  - 104.0
  - 117.0
  - 123.0
  std:
  - 1.0
  - 1.0
  - 1.0
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: retinaface_decode
  variant: retinaface
dataset:
  type: WiderFace
  eval_path: ${DATA_ROOT}/widerface
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
