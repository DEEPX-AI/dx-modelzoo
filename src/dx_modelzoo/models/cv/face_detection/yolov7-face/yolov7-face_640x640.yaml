name: yolov7-face_640x640
display_name: YOLOv7-face
task: face_detection
reference: https://github.com/derronqi/yolov7-face
license: GPL-3.0
description: >-
  YOLOv7-Face detector on a 640x640 RGB input that predicts face bounding boxes (with
  landmarks) and confidences. Postprocessing (yolov7_face_decode) decodes anchors/priors
  and applies NMS. Evaluated on the WiderFace benchmark reporting Average Precision
  (AP).
macs: 54.63 GMACs
params: 36.56 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: div
  x: 255
- type: expanddim
  axis: 0
postprocessing:
- type: yolov7_face_decode
  variant: yolov7_face
  conf_thres: 0.01
  iou_thres: 0.5
dataset:
  type: WiderFace
  eval_path: ${DATA_ROOT}/widerface
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
    runtime:
      device: 0
