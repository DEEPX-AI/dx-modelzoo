name: scrfd-10g_640x640
display_name: SCRFD-10G
task: face_detection
reference: https://github.com/deepinsight/insightface
description: >-
  SCRFD efficient face detector on a 640x640 RGB input that predicts face bounding boxes
  (with landmarks) and confidences. Postprocessing (scrfd_decode) decodes anchors/priors
  and applies NMS. Evaluated on the WiderFace benchmark reporting Average Precision
  (AP).
macs: 13.41 GMACs
params: 4.23 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: normalize
  mean:
  - 127.5
  - 127.5
  - 127.5
  std:
  - 128.0
  - 128.0
  - 128.0
- type: expanddim
  axis: 0
postprocessing:
- type: scrfd_decode
  iou_thres: 0.45
dataset:
  type: WiderFace
  eval_path: ${DATA_ROOT}/widerface
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      quantization:
        lite:
          method: ema
          num_samples: 100
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      quantization:
        pro:
          num_samples: 1024
          method: ema
    runtime:
      device: 0
