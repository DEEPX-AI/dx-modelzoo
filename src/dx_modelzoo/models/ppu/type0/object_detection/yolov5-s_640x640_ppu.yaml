name: yolov5-s_640x640_ppu
display_name: Ultralytics YOLOv5-s (PPU)
task: object_detection
reference: https://github.com/ultralytics/yolov5
license: GPL-3.0
description: >-
  YOLOv5 object detector taking a 640x640 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (ppu_nms) decodes the raw outputs into boxes and applies
  non-maximum suppression. Evaluated on the COCO detection benchmark reporting mean
  Average Precision (mAP@0.5:0.95).
macs: 9.10 GMACs
params: 7.23 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 640
  - 640
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 640
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: ppu_nms
  variant: yolo
  yolo_version: v5
  anchors:
  - - - 10
      - 13
    - - 16
      - 30
    - - 33
      - 23
  - - - 30
      - 61
    - - 62
      - 45
    - - 59
      - 119
  - - - 116
      - 90
    - - 156
      - 198
    - - 373
      - 326
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

ppu_config: &ppu_config
  type: 0
  conf_thres: 0.001
  activation: Sigmoid
  num_classes: 80
  layer:
    Conv_199:
      num_anchors: 3
    Conv_218:
      num_anchors: 3
    Conv_237:
      num_anchors: 3

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
      ppu_config: *ppu_config
    runtime:
      device: 0
