name: yolov4_512x512_ppu
display_name: YOLOv4 (PPU)
task: object_detection
reference: https://github.com/AlexeyAB/darknet
license: GPL-3.0
description: >-
  YOLOv4 object detector taking a 512x512 RGB image (NCHW) and producing dense box/class
  predictions. Postprocessing (ppu_nms) decodes the raw outputs into boxes and applies
  non-maximum suppression. Evaluated on the COCO detection benchmark reporting mean
  Average Precision (mAP@0.5:0.95).
macs: 51.04 GMACs
params: 64.33 M
inputs:
- name: input
  shape:
  - 1
  - 3
  - 512
  - 512
  dtype: float32
  layout: NCHW
preprocessing:
- type: resize
  mode: pad
  size: 512
  pad_location: edge
  pad_value:
  - 114
  - 114
  - 114
- type: div
  x: 255
- type: convertcolor
  form: BGR2RGB
- type: transpose
  axis:
  - 2
  - 0
  - 1
- type: expanddim
  axis: 0
postprocessing:
- type: ppu_nms
  variant: yolo
  yolo_version: v4
  anchors:
  - - - 12
      - 16
    - - 19
      - 36
    - - 40
      - 28
  - - - 36
      - 75
    - - 76
      - 55
    - - 72
      - 146
  - - - 142
      - 110
    - - 192
      - 243
    - - 459
      - 401
dataset:
  type: COCO
  eval_path: ${DATA_ROOT}/COCO
artifacts:
  path: ${MODEL_ROOT}/${MODEL_NAME}
calibration: &calibration
  method: ema
  num: 100
  seed: 42

ppu_config: &ppu_config
  type: 0
  conf_thres: 0.001
  activation: Sigmoid
  num_classes: 80
  layer:
    Conv_368:
      num_anchors: 3
    Conv_854:
      num_anchors: 3
    Conv_1340:
      num_anchors: 3

profiles:
  onnx:
    target: onnx
    runtime:
      device: gpu
      batch_size: 1
  c-lite:
    target: dxnn
    compile:
      opt_level: 0
      calibration: *calibration
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-lite:
    target: dxnn
    compile:
      calibration: *calibration
      ppu_config: *ppu_config
    runtime:
      device: 0
  q-pro:
    target: dxnn
    compile:
      calibration:
        <<: *calibration
        num: 1024
        use_q_pro: true
      ppu_config: *ppu_config
    runtime:
      device: 0
