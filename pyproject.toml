[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "dx-modelzoo"
version = "0.10.0"
description = "YAML-centric modelzoo for DX runtime"
urls = {Homepage = "https://deepx.ai", Repository = "https://github.com/DEEPX-AI/dx-modelzoo"}
requires-python = ">=3.8"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pyyaml>=5.0",
    "numpy>=1.20,<2.0",
    "Pillow>=8.0",
    "opencv-python>=4.5",
    "python-dotenv>=0.19",
    "tqdm>=4.60",
    "loguru>=0.6",
    "typer>=0.9",
    "rich>=12.0",
    "textual>=0.40",
    "h5py",
    "scipy",
    "faster-coco-eval",
    "torch<2.5.0; python_version >= '3.8' and python_version < '3.10'",
    "torch>=2.5.0; python_version >= '3.10' and python_version <= '3.14'",
    "open_clip_torch",
    "transformers",
    "pyclipper>=1.3.0.post6",
    "shapely>=2.0.7",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.15"]
gpu = [
    "onnxruntime-gpu>=1.17",
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-curand-cu12",
    "nvidia-cufft-cu12",
    "nvidia-cusolver-cu12",
    "nvidia-cusparse-cu12",
    "nvidia-nccl-cu12",
    "nvidia-nvjitlink-cu12",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=3.0",
    "ruff>=0.1",
    "pre-commit>=3.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]
internal = ["requests>=2.25", "onnx>=1.14", "onnx_tool"]
all = ["dx-modelzoo[cpu,dev,docs]"]

[project.scripts]
dxmz = "dx_modelzoo.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dx_modelzoo = ["models/**/*.yaml", "models/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/dx_modelzoo"]
omit = [
    "src/dx_modelzoo/tui/*",
    "src/dx_modelzoo/models/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
