site_name: DXNN DX-ModelZoo User Manual
use_directory_urls: false
docs_dir: source # markdown 원문 폴더
site_dir: docs # html로 변환된 폴더
theme:
  name : material
  language: en
  font:
    text: Noto Sans Display
    code: Roboto Mono
  logo: img/deepx.png
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
     - toc.integrate
     - content.code.annotate
     - navigation.tabs
     - navigation.tabs.sticky
     - content.tabs.link
     - content.code.copy
site_url: 'https://developer.deepx.ai/'
nav:
  - Quick Start: 00_Quick_Start.md
  - DX-ModelZoo Overview: 01_DX-ModelZoo_Overview.md
  - Getting Started:
      - Installation: 02_01_Installation.md
  - Workflows:
      - Model Evaluation: 02_02_Model_Evaluation.md
      - YAML Configuration: 02_03_YAML_Configuration.md
      - Datasets: 02_04_Datasets_Guide.md
      - Custom Models: 02_05_Custom_Models.md
      - Custom Datasets: 02_06_Custom_Datasets.md
  - Architecture:
      - Overview: 03_01_Architecture_Overview.md
      - Pipeline: 03_02_Execution_Pipeline.md
      - Registry: 03_03_Registry.md
  - API Reference:
      - CLI: 04_01_CLI_Reference.md
      - ModelBuilder: 04_02_ModelBuilder_API.md
      - Session: 04_03_Session_API.md
      - DataLoader: 04_04_DataLoader_API.md
      - Datasets: 04_05_Datasets_API.md
      - Evaluator: 04_06_Evaluator_API.md
      - Preprocessing: 04_07_Preprocessing_API.md
      - Postprocessing: 04_08_Postprocessing_API.md

plugins:
  - search
  - include-markdown
  - to-pdf:
      author: DEEPX.ai
      copyright: ⓒ Copyright 2026 DEEPX All Rights Reserved.
      cover_title: DXNN DX-ModelZoo User Manual
      cover_subtitle: 2026/09/14 (v1.0.0)
      cover_logo : img/deepx.png
      custom_template_path: source/stylesheets
      output_path: ../DEEPX_DX-ModelZoo_UM_v1.0.0_SEP_2026.pdf
extra:
  homepage: https://developer.deepx.ai
#  version:
#    provider: mike
#    default: stable
  generator: false
  social:
#     - icon: fontawesome/brands/github
#       link: https://github.com/deepx-ai
     - icon: fontawesome/brands/linkedin
       link: https://www.linkedin.com/company/deepx-corporation/
extra_css:
  - stylesheets/extra.css
markdown_extensions:
  - admonition
  - def_list
  - toc:
        permalink: "true"
        baselevel: 1
        toc_depth: 3
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
# extra_javascript:
#  - https://polyfill.io/v3/polyfill.min.js?features=es6
copyright: ⓒ Copyright 2026 <a href="http://deepx.ai">DEEPX</a>. All Rights Reserved.
